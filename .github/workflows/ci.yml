name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: library_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply schema
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          psql -h localhost -U postgres -d library_test_db -f db/schema.sql
          psql -h localhost -U postgres -d library_test_db -f migrations/2026-07-11_initial.sql
          psql -h localhost -U postgres -d library_test_db -f migrations/2026-07-13_change_status.sql
          psql -h localhost -U postgres -d library_test_db -f migrations/2026-07-15_adding_user.sql
          psql -h localhost -U postgres -d library_test_db -f migrations/2026-07-20_add_columns.sql
          psql -h localhost -U postgres -d library_test_db -f migrations/2026-07-22_pic_field.sql
          psql -h localhost -U postgres -d library_test_db -f migrations/2026-07-23_changing_columns_name.sql
          psql -h localhost -U postgres -d library_test_db -f migrations/2026-07-24_answ_soul.sql
          psql -h localhost -U postgres -d library_test_db -f migrations/2026-07-24_solution_table.sql

      - name: Lint
        run: |
          echo "--- ruff version ---"
          ruff --version
          echo "--- running ruff ---"
          ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library_test_db
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long!!
        run: |
          echo "--- python version ---"
          python --version
          echo "--- pytest version ---"
          pytest --version
          echo "--- running tests ---"
          pytest -v --tb=long